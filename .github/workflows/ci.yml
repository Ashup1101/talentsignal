name: CI

# pytest, the Airflow DAG tests and the ML tests run on every push / PR to main; dbt build runs
# on PRs against a throwaway Postgres. Planned: Streamlit redeploy on push to main
# (Phase 6).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: pytest
    # Pinned rather than ubuntu-latest (which moves to Ubuntu 26 on 2026-10-19)
    # so CI only changes when we choose to upgrade it.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      # PySpark (tests/test_processing.py) runs on the JVM.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # Tests stub S3 and HTTP calls, so no secrets are needed here.
      - name: Run tests
        run: pytest -q

  dbt:
    name: dbt build
    # Pull requests only: what lands on main was already built in its PR.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      # Throwaway database: exists only for this job run, then is deleted.
      # Same major version as RDS. ci/ci is not a secret — it never leaves the runner.
      # The official image via Amazon's ECR Public mirror: Docker Hub rate-limits
      # anonymous pulls per IP, and GitHub's shared runner IPs hit that limit.
      postgres:
        image: public.ecr.aws/docker/library/postgres:18
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: talentsignal
        ports:
          - 5432:5432
        # Wait until Postgres accepts connections before running any step.
        options: >-
          --health-cmd "pg_isready -U ci -d talentsignal"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      RDS_HOST: localhost
      RDS_PORT: "5432"
      RDS_DB: talentsignal
      RDS_USER: ci
      RDS_PASSWORD: ci
      # The container has no TLS certificate; traffic never leaves the runner.
      DBT_SSLMODE: disable
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      # Runtime deps only (dbt, no PySpark/Java) — much faster than requirements-dev.
      - name: Install dependencies
        run: pip install -r requirements.txt

      # Real sample of raw.* written by src/dbt_project/ci/make_fixtures.py.
      - name: Load test fixtures into raw.*
        run: psql "postgresql://ci:ci@localhost:5432/talentsignal" -v ON_ERROR_STOP=1 -q -f src/dbt_project/ci/raw_fixtures.sql

      - name: dbt build
        run: |
          cp src/dbt_project/profiles.yml.example src/dbt_project/profiles.yml
          dbt build --project-dir src/dbt_project --profiles-dir src/dbt_project

  dags:
    name: DAG tests (Airflow)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        id: python
        with:
          python-version: "3.11"
          cache: pip
          # install.sh pins the Airflow version, so it is the right cache key.
          cache-dependency-path: infra/airflow/install.sh

      # The same script as local setup: Airflow's version and constraints file are
      # pinned in exactly one place. Airflow gets its own environment, apart from
      # the pipeline's dependencies.
      - name: Install Airflow (infra/airflow/install.sh)
        run: infra/airflow/install.sh
        env:
          PYTHON_BIN: ${{ steps.python.outputs.python-path }}

      - name: DAG tests
        run: .venv-airflow/bin/pytest -q tests/test_dags.py

  ml:
    name: ML tests (CPU-only PyTorch)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ml.txt

      # CPU-only PyTorch (~200 MB) instead of the default build plus ~1 GB of NVIDIA
      # GPU libraries CI can't use. The version is read from requirements-ml.txt, and
      # the "+cpu" build satisfies that pin, so the next step keeps it.
      - name: Install CPU-only PyTorch
        run: pip install "torch==$(grep -E '^torch==' requirements-ml.txt | cut -d= -f3)" --index-url https://download.pytorch.org/whl/cpu

      # --no-deps: install exactly the lock. It was compiled on macOS, so letting pip
      # resolve again on Linux pulls Linux-only extras such as XGBoost's 352 MB
      # nvidia-nccl-cu12 (GPU-only; CI has no GPU).
      - name: Install dependencies
        run: pip install --no-deps -r requirements-ml.txt

      # The pinned embedding model (~90 MB) is downloaded from Hugging Face once, then
      # restored from this cache, so runs don't hit the Hub's anonymous rate limit.
      # embeddings.py pins the model revision, so it is the right cache key.
      - name: Cache embedding model
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-${{ hashFiles('src/ml/embeddings.py') }}

      - name: ML tests
        run: pytest -q tests/test_ml.py tests/test_nlp.py tests/test_embeddings.py tests/test_topics.py
