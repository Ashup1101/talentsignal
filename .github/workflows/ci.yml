name: CI

# pytest, the Airflow DAG tests, the ML / API / web tests and the Docker image build run on
# every push / PR to main; dbt build runs on PRs against a throwaway Postgres. On a push to
# main, once those pass: publish the images to GHCR; the server deploys them itself
# (infra/deploy/update.sh, every 2 minutes) and the release job waits for the live site to
# serve this commit, then runs the public smoke test. No AWS credentials live in GitHub.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: pytest
    # Pinned rather than ubuntu-latest (which moves to Ubuntu 26 on 2026-10-19)
    # so CI only changes when we choose to upgrade it.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      # PySpark (tests/test_processing.py) runs on the JVM.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # Tests stub S3 and HTTP calls, so no secrets are needed here.
      - name: Run tests
        run: pytest -q

  dbt:
    name: dbt build
    # Pull requests only: what lands on main was already built in its PR.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      # Throwaway database: exists only for this job run, then is deleted.
      # Same major version as RDS. ci/ci is not a secret — it never leaves the runner.
      # The official image via Amazon's ECR Public mirror: Docker Hub rate-limits
      # anonymous pulls per IP, and GitHub's shared runner IPs hit that limit.
      postgres:
        image: public.ecr.aws/docker/library/postgres:18
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: talentsignal
        ports:
          - 5432:5432
        # Wait until Postgres accepts connections before running any step.
        options: >-
          --health-cmd "pg_isready -U ci -d talentsignal"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      RDS_HOST: localhost
      RDS_PORT: "5432"
      RDS_DB: talentsignal
      RDS_USER: ci
      RDS_PASSWORD: ci
      # The container has no TLS certificate; traffic never leaves the runner.
      DBT_SSLMODE: disable
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      # Runtime deps only (dbt, no PySpark/Java) — much faster than requirements-dev.
      - name: Install dependencies
        run: pip install -r requirements.txt

      # Real sample of raw.* written by src/dbt_project/ci/make_fixtures.py.
      - name: Load test fixtures into raw.*
        run: psql "postgresql://ci:ci@localhost:5432/talentsignal" -v ON_ERROR_STOP=1 -q -f src/dbt_project/ci/raw_fixtures.sql

      - name: dbt build
        run: |
          cp src/dbt_project/profiles.yml.example src/dbt_project/profiles.yml
          dbt build --project-dir src/dbt_project --profiles-dir src/dbt_project

  dags:
    name: DAG tests (Airflow)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        id: python
        with:
          python-version: "3.11"
          cache: pip
          # install.sh pins the Airflow version, so it is the right cache key.
          cache-dependency-path: infra/airflow/install.sh

      # The same script as local setup: Airflow's version and constraints file are
      # pinned in exactly one place. Airflow gets its own environment, apart from
      # the pipeline's dependencies.
      - name: Install Airflow (infra/airflow/install.sh)
        run: infra/airflow/install.sh
        env:
          PYTHON_BIN: ${{ steps.python.outputs.python-path }}

      - name: DAG tests
        run: .venv-airflow/bin/pytest -q tests/test_dags.py

  ml:
    name: ML tests (CPU-only PyTorch)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ml.txt

      # CPU-only PyTorch (~200 MB) instead of the default build plus ~1 GB of NVIDIA
      # GPU libraries CI can't use. The version is read from requirements-ml.txt, and
      # the "+cpu" build satisfies that pin, so the next step keeps it.
      - name: Install CPU-only PyTorch
        run: pip install "torch==$(grep -E '^torch==' requirements-ml.txt | cut -d= -f3)" --index-url https://download.pytorch.org/whl/cpu

      # --no-deps: install exactly the lock. It was compiled on macOS, so letting pip
      # resolve again on Linux pulls Linux-only extras such as XGBoost's 352 MB
      # nvidia-nccl-cu12 (GPU-only; CI has no GPU).
      - name: Install dependencies
        run: pip install --no-deps -r requirements-ml.txt

      # The pinned embedding model (~90 MB) is downloaded from Hugging Face once, then
      # restored from this cache, so runs don't hit the Hub's anonymous rate limit.
      # embeddings.py pins the model revision, so it is the right cache key.
      - name: Cache embedding model
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-${{ hashFiles('src/ml/embeddings.py') }}

      - name: ML tests
        run: >-
          pytest -q tests/test_ml.py tests/test_nlp.py tests/test_embeddings.py tests/test_topics.py
          tests/test_features.py tests/test_salary_model.py tests/test_demand_forecast.py
          tests/test_resume_features.py tests/test_api_logic.py tests/test_api_routes.py

  api:
    name: API tests (server lock)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-app.txt

      # Exactly what the server image installs: CPU-only PyTorch, then the server lock
      # with --no-deps. If the API needed a package missing from requirements-app.txt,
      # this job (not the laptop-lock jobs) would catch it. Plus pytest, pinned.
      - name: Install the server lock
        run: |
          pip install "torch==$(grep -E '^torch==' requirements-app.txt | cut -d= -f3)" --index-url https://download.pytorch.org/whl/cpu
          pip install --no-deps -r requirements-app.txt
          pip install "pytest==$(grep -E '^pytest==' requirements-dev.txt | cut -d= -f3)"

      - name: Cache embedding model
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-${{ hashFiles('src/ml/embeddings.py') }}

      - name: API tests
        run: pytest -q tests/test_api_routes.py tests/test_api_logic.py tests/test_api_data.py tests/test_db_setup.py

  web:
    name: Web (lint, types, tests, static build)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7

      # Node 24 LTS: what the frontend is built with (Node 20 reached end of life 2026-04).
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      # The committed types must match web/openapi.json (python -m src.api.export_openapi
      # keeps that file in step with the API; test_api_routes.py checks it).
      - name: API types are up to date
        run: |
          npm run gen:api
          git diff --exit-code -- src/lib/api-types.ts

      - name: Tests
        run: npm test

      # The static export nginx will serve (out/).
      - name: Build
        run: npm run build

  docker:
    name: Docker build (API + web images)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Both images as the server runs them (linux/amd64, like the EC2 t3.small), loaded
      # locally, not pushed: the publish job pushes them on main.
      # Layers are cached in GitHub's Actions cache, so unchanged dependencies don't rebuild.
      - name: Build the API image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/docker/api.Dockerfile
          tags: talentsignal-api:ci
          load: true
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Build the web image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/docker/web.Dockerfile
          tags: talentsignal-web:ci
          build-args: GIT_SHA=${{ github.sha }}
          load: true
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

      # The API image alone, with no network: OpenMP pinned, the API imports, and the
      # baked-in embedding model loads without Hugging Face.
      - name: API image works offline
        run: |
          docker run --rm --network none talentsignal-api:ci python -c "
          import os; assert os.environ['OMP_NUM_THREADS'] == '1'
          import src.api.main
          from src.ml.embeddings import load_model; load_model()
          print('ok')"

      # Both containers together (no database here: /api/health needs none).
      - name: Compose smoke test
        env:
          API_IMAGE: talentsignal-api:ci
          WEB_IMAGE: talentsignal-web:ci
        run: |
          docker compose -f infra/docker-compose.yml up --no-build --detach --wait
          curl -fsS http://127.0.0.1/api/health
          curl -fsS http://127.0.0.1/ | grep -q "TalentSignal"
          curl -fsS http://127.0.0.1/analyze/ | grep -q "Resume Analyzer"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1/no-such-page/)" = 404
          curl -fsS http://127.0.0.1/version.json | grep -q "$GITHUB_SHA"

      # The server's modes with a self-signed certificate: HTTPS + redirect, and the
      # first-deploy fallback (HTTP that still serves the ACME challenge).
      - name: nginx HTTPS modes
        run: infra/docker/test_tls.sh talentsignal-web:ci

      - name: Container logs
        if: failure()
        run: docker compose -f infra/docker-compose.yml logs

  # --- Release (push to main only) -------------------------------------------------------------

  publish:
    name: Publish images (GHCR)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, dags, ml, api, web, docker]  # dbt runs on PRs only
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tagged with the commit (what the server runs) and latest; the layers come from the
      # docker job's cache. The source label links the packages to this public repo.
      - name: Push the API image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/docker/api.Dockerfile
          push: true
          tags: |
            ghcr.io/ashup1101/talentsignal-api:${{ github.sha }}
            ghcr.io/ashup1101/talentsignal-api:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=api

      # Last: web:latest is the release pointer the server watches, so the API image of the
      # same commit already exists when the server sees it.
      - name: Push the web image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/docker/web.Dockerfile
          push: true
          build-args: GIT_SHA=${{ github.sha }}
          tags: |
            ghcr.io/ashup1101/talentsignal-web:${{ github.sha }}
            ghcr.io/ashup1101/talentsignal-web:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=web

      # The server pulls anonymously: the packages must be public.
      - name: Images are publicly pullable
        run: |
          for image in talentsignal-api talentsignal-web; do
            token=$(curl -fsS "https://ghcr.io/token?scope=repository:ashup1101/$image:pull" | jq -r .token)
            curl -fsS -o /dev/null -H "Authorization: Bearer $token" \
              -H "Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json" \
              "https://ghcr.io/v2/ashup1101/$image/manifests/${{ github.sha }}" \
              || { echo "::error::$image is not public: Packages → $image → Package settings → Change visibility"; exit 1; }
            echo "$image:${{ github.sha }} is public"
          done

  release:
    name: Live on EC2 + public smoke test
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    concurrency:
      group: release
      cancel-in-progress: true  # a newer commit supersedes this one on the server anyway
    env:
      APP_HOST: ${{ vars.APP_HOST }}
    steps:
      - uses: actions/checkout@v7

      # The server checks GHCR every 2 minutes, then deploys (pull + restart, ~2 min).
      - name: Wait for the server to run this commit
        run: |
          test -n "$APP_HOST" || { echo "::error::repository variable APP_HOST is not set"; exit 1; }
          for _ in $(seq 120); do
            live=$(curl -fsS --max-time 10 "https://$APP_HOST/version.json" 2>/dev/null | jq -r .commit 2>/dev/null || true)
            if [ "$live" = "$GITHUB_SHA" ]; then echo "live: $live"; exit 0; fi
            sleep 10
          done
          echo "::error::https://$APP_HOST/ still serves ${live:-nothing} after 20 minutes"
          exit 1

      - name: Public smoke test
        run: infra/deploy/smoke_test.sh "$APP_HOST"
