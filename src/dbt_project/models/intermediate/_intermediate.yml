version: 2

models:
  - name: int_jobs_enriched
    description: One row per posting with seniority, skill_count, UTC posting date/week and star-schema keys.
    columns:
      - name: job_id
        data_tests: [unique, not_null]
      - name: role_key
        data_tests: [not_null]
      - name: location_key
        data_tests: [not_null]
      - name: seniority
        description: Rule-based from the title; 'mid' when no level word (see seniority_from_title).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [intern, junior, mid, senior, staff_plus, manager]
      - name: seniority_effective
        description: >
          The title's level when stated; else from years of experience
          (< 2 junior, 2–3 mid, 4–6 senior, 7+ staff_plus); else 'unknown'.
          Used by the salary model (a resume user picks their level).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [intern, junior, mid, senior, staff_plus, manager, unknown]
      - name: seniority_source
        description: Where seniority_effective came from.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [title, years, none]

  - name: int_job_skills_joined
    description: One row per (posting, skill) with the posting attributes skill marts group by.
    data_tests:
      - unique:
          column_name: "job_id || '|' || skill_name"
