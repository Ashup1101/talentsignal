version: 2

models:
  - name: stg_jobs
    description: One row per unique job posting (raw.jobs_clean with clearer column names).
    columns:
      - name: job_id
        data_tests:
          - unique
          - not_null
          # Warn only: a posting without an ml.posting_nlp row means the NLP step
          # hasn't run since the last reload (it joins the daily DAG in Phase 5.5);
          # such postings fall back to seniority_effective 'unknown' unless titled.
          - relationships:
              arguments:
                to: ref('stg_posting_nlp')
                field: job_id
              config:
                severity: warn
      - name: dedup_key
        description: One kept posting per content key (Phase 2 content dedup).
        data_tests: [unique, not_null]
      - name: search_role
        description: The role searched for; must exist in the role_soc_mapping seed.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('role_soc_mapping')
                field: search_role
      - name: salary_flag
        description: Why the salary was discarded, if it was (NULL = salary kept or absent).
        data_tests:
          - accepted_values:
              arguments:
                values: [out_of_range, unknown_period, inverted_range]

  - name: stg_job_sightings
    description: One row per posting per collection, before dedup.
    data_tests:
      - unique:
          column_name: "job_id || '|' || fetched_at"
    columns:
      - name: job_id
        data_tests: [not_null]
      - name: fetched_at
        data_tests: [not_null]
      - name: dedup_key
        description: Content key; every sighting must map to the posting jobs_clean kept.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_jobs')
                field: dedup_key

  - name: stg_skills
    description: One row per (job posting, skill).
    data_tests:
      - unique:
          column_name: "job_id || '|' || skill_name"
    columns:
      - name: job_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_jobs')
                field: job_id
      - name: skill_name
        data_tests: [not_null]
      - name: skill_category
        data_tests:
          - accepted_values:
              arguments:
                values: [language, data_engineering, database, cloud, devops, ml_ai, analytics_bi, web]

  - name: stg_posting_nlp
    description: Years of experience per posting (ml.posting_nlp, from src/ml/nlp_pipeline.py).
    columns:
      - name: job_id
        data_tests: [unique, not_null]

  - name: stg_topics
    description: BERTopic topics (ml.topics); topic_id -1 = unassigned postings.
    columns:
      - name: topic_id
        data_tests: [unique, not_null]
      - name: topic_label
        data_tests: [not_null]

  - name: stg_posting_topics
    description: Each posting's topic (ml.posting_topics).
    columns:
      - name: job_id
        data_tests: [unique, not_null]
      - name: topic_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_topics')
                field: topic_id

  - name: stg_bls_occupations
    description: One row per BLS detailed occupation.
    columns:
      - name: soc_code
        data_tests: [unique, not_null]
