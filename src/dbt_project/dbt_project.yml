# TalentSignal dbt project.
# raw.* (loaded by src/processing/load_postgres.py) → staging views →
# intermediate views → star schema + marts tables.
# Run from the repo root so .env is loaded, e.g.:
#   dotenv -f .env run -- dbt build --project-dir src/dbt_project --profiles-dir src/dbt_project
name: talentsignal
version: "1.0.0"
profile: talentsignal

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
clean-targets: ["target", "dbt_packages"]

vars:
  # Salary statistics from fewer postings than this are reported as "too few".
  min_salary_sample: 5
  # seniority_effective for titles with no level word, from years of experience
  # (ml.posting_nlp): < 2 junior, 2–3 mid, 4–6 senior, 7+ staff_plus.
  seniority_min_years_mid: 2
  seniority_min_years_senior: 4
  seniority_min_years_staff_plus: 7

# Schemas are named <target schema>_<folder schema>, e.g. analytics_staging.
models:
  talentsignal:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts

seeds:
  talentsignal:
    +schema: reference
    role_soc_mapping:
      # Keep codes like 15-1243 as text instead of letting dbt guess a type.
      +column_types:
        search_role: text
        soc_code: text
        onet_soc_code: text
        onet_title: text
        evidence: text
        source: text
