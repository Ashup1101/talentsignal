[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "talentsignal"
version = "0.1.0"
description = "Job market intelligence and predictive analytics platform."
readme = "README.md"
requires-python = ">=3.11,<3.12"
# Runtime deps added phase by phase.
dependencies = [
    "boto3>=1.34",
    "openpyxl>=3.1",
    "python-dotenv>=1.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pip-tools>=7.4",
    "pytest>=8.0",
    "responses>=0.25",
    # Phase 2: local Spark. Databricks Runtime 18 LTS ships these (Spark 4.1),
    # so they are only needed to run and test processing code on a laptop.
    "pyspark[sql]>=4.1,<4.2",
    "delta-spark>=4.3,<4.4",
]

[tool.setuptools]
# Not an installable package; code runs from the repo root (python -m src....).
packages = []

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
