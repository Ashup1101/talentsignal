[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "talentsignal"
version = "0.1.0"
description = "Job market intelligence and predictive analytics platform."
readme = "README.md"
requires-python = ">=3.11,<3.12"
# Runtime deps added phase by phase.
dependencies = [
    "boto3>=1.34",
    # Phase 3: dbt runs SQL models inside RDS PostgreSQL (laptop, CI, Airflow).
    "dbt-core>=1.12,<1.13",
    "dbt-postgres>=1.11,<1.12",
    "openpyxl>=3.1",
    # Phase 3: load_postgres creates the raw schema and verifies row counts.
    "psycopg2-binary>=2.9",
    "python-dotenv>=1.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pip-tools>=7.4",
    "pytest>=8.0",
    "responses>=0.25",
    # Phase 2: local Spark. Databricks Runtime 18 LTS ships these (Spark 4.1),
    # so they are only needed to run and test processing code on a laptop.
    "pyspark[sql]>=4.1,<4.2",
    "delta-spark>=4.3,<4.4",
]
# Phase 5: NLP + ML. Locked together with dev in requirements-ml.txt (the laptop
# environment and the CI `ml` job); requirements-dev.txt stays lean for CI pytest.
# PyTorch comes in via sentence-transformers; CI installs its CPU-only build.
ml = [
    "spacy>=3.8,<4",
    "sentence-transformers>=6.1,<7",
    "bertopic>=0.17,<0.18",
    "xgboost>=3.2,<4",
    "prophet>=1.5,<2",
    "scikit-learn>=1.9,<2",
    # The client only: tracking is hosted on Databricks Free Edition.
    "mlflow-skinny>=3.17,<4",
    "pdfplumber>=0.11,<0.12",
]

[tool.setuptools]
# Not an installable package; code runs from the repo root (python -m src....).
packages = []

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
