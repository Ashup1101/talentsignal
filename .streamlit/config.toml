# Streamlit settings for the TalentSignal app (read from the working directory: run from the repo root).

[server]
# Resumes are small; this also caps what one upload can make the server parse.
maxUploadSize = 5
headless = true

[browser]
# No usage statistics sent to Streamlit's servers.
gatherUsageStats = false

[client]
# Visitors see a short error message, never a stack trace with file paths.
showErrorDetails = "none"
toolbarMode = "viewer"
