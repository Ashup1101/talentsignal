# HTTPS on the server: __TLS_HOST__ is replaced at container start (40-talentsignal-tls.sh)
# by TLS_HOST, e.g. 77-113-138-96.sslip.io, whose Let's Encrypt certificate certbot keeps
# in /etc/letsencrypt (mounted read-only from the host).

# Port 80: only the ACME challenge (renewals) and a redirect to HTTPS.
server {
    listen 80;
    server_name _;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
    }
    location / {
        return 301 https://__TLS_HOST__$request_uri;  # the fixed host, never the Host header
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name __TLS_HOST__;

    ssl_certificate /etc/letsencrypt/live/__TLS_HOST__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__TLS_HOST__/privkey.pem;
    # Mozilla "intermediate" settings: TLS 1.2 + 1.3, forward-secret AEAD ciphers only.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # One day only: sslip.io is a borrowed hostname and this server may be short-lived.
    add_header Strict-Transport-Security "max-age=86400" always;

    include /etc/nginx/talentsignal/app.locations;
}
