# HTTP only: the laptop and CI (no TLS_HOST), and the server until its first certificate
# exists. Serves the ACME challenge so certbot can get that certificate.
server {
    listen 80;
    server_name _;

    # Liveness for the image's HEALTHCHECK (and docker compose --wait), in every mode.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
    }

    include /etc/nginx/talentsignal/app.locations;
}
