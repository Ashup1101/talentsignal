# http-level settings shared by both site variants (http.conf, https.conf).

# Resume analysis is the expensive call (~1 s of CPU): per visitor, 20 a minute with a
# burst of 10 (changing role or level re-runs it on the same file).
limit_req_zone $binary_remote_addr zone=analyze:10m rate=20r/m;

upstream api {
    server api:8000;
    keepalive 8;
}
